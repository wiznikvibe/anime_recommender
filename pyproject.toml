[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anime-recommender"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.3.7",
    "langchain>=1.2.0",
    "langchain-community>=0.4.1",
    "langchain-groq>=1.1.1",
    "langchain-huggingface>=1.2.0",
    "langchain-text-splitters>=1.1.0",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.2.0",
    "streamlit>=1.52.2",
    # Declared directly so tool.uv.sources can pin the CPU wheel (transitive
    # torch from sentence-transformers alone would pull CUDA + nvidia-* on Linux).
    "torch>=2.9.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "pipeline", "app", "config"]

# CPU-only PyTorch: embeddings do not need CUDA. Default PyPI wheels pull
# ~6GB of nvidia-* packages on Linux x86_64 and stall Docker export/unpack on VMs.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
