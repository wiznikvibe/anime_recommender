# Local / GCP VM deployment (no Kubernetes required).
# Usage on the VM (unset DOCKER_HOST so the local daemon is used):
#   cp .env.example .env   # then set GROQ_API_KEY
#   env -u DOCKER_HOST docker compose up -d --build
#   env -u DOCKER_HOST docker compose logs -f
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llmops-app:latest
    container_name: llmops-app
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env or the shell}
    restart: unless-stopped
    # Named volume inherits ownership from the image dir (uid 1000).
    volumes:
      - hf-cache:/app/.cache/huggingface

volumes:
  hf-cache:
